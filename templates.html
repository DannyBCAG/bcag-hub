<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCAG Templates (Admin)</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #f5f1e8;
    font-family: Arial, sans-serif;
    color: #333;
}

h1 {
    text-align: center;
    margin: 5px 0 18px;
    font-size: 26px;
}

.back-link {
    display: inline-block;
    margin-bottom: 15px;
    color: #333;
    text-decoration: none;
    font-size: 16px;
}

#message {
    text-align: center;
    padding: 30px 10px;
    font-size: 17px;
}

#list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.painting {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    cursor: pointer;
}

.painting img {
    width: 100%;
    height: 130px;
    object-fit: contain;
    display: block;
    background: white;
}

.painting-title {
    padding: 8px 5px 4px;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
}

.no-template {
    display: block;
    padding: 0 5px 8px;
    font-size: 12px;
    color: #999;
    text-align: center;
}

/* FULL SIZE VIEWER */

#viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    overflow-y: auto;
    padding: 20px;
}

#viewer-content {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
}

#closeViewer {
    position: fixed;
    top: 12px;
    right: 18px;
    color: white;
    font-size: 34px;
    cursor: pointer;
    z-index: 1001;
}

#fullImage {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
    margin-top: 35px;
}

#fullTitle {
    color: white;
    font-size: 21px;
    margin: 15px 0;
}

#downloadButton {
    display: inline-block;
    background: white;
    color: #333;
    border-radius: 8px;
    padding: 13px 20px;
    font-size: 16px;
    text-decoration: none;
}

</style>

</head>


<body>

<a class="back-link" href="members.html">&larr; Back</a>

<h1>Templates (Admin)</h1>

<div id="message">
    Loading templates...
</div>

<div id="list"></div>


<!-- FULL SIZE VIEW -->

<div id="viewer">

    <div id="closeViewer">&times;</div>

    <div id="viewer-content">

        <img
            id="fullImage"
            src=""
            alt=""
        >

        <div id="fullTitle"></div>

        <a
            id="downloadButton"
            href=""
            target="_blank"
            download
        >
            Download
        </a>

    </div>

</div>


<script>

/* Only allow admin to view this page */

const role =
    localStorage.getItem("bcagRole");

if (role !== "admin") {

    window.location.href = "members.html";

}


/* GOOGLE APPS SCRIPT */

const API_URL =
"https://script.google.com/macros/s/AKfycbwQbdX_P5WPDWFaPXo3zcjiyxBGH-78_NLi3eE4aBLjGSlRM0S-eJ0cOGKPK9SX8eF6/exec";


let paintings = [];


fetch(API_URL)

    .then(response => response.json())

    .then(data => {

        paintings = data;

        const list =
            document.getElementById("list");

        const message =
            document.getElementById("message");


        message.style.display = "none";


        if (!paintings.length) {

            message.style.display = "block";

            message.textContent =
                "No paintings found.";

            return;

        }


        paintings.forEach((painting, index) => {

            const card =
                document.createElement("div");


            card.className =
                "painting";


            if (!painting.template) {

                card.innerHTML = `
                    <div class="painting-title">
                        ${escapeHtml(painting.title)}
                    </div>
                    <span class="no-template">No template uploaded</span>
                `;

                list.appendChild(card);

                return;

            }


            card.innerHTML = `

                <img
                    src="${painting.template}"
                    alt="${escapeHtml(painting.title)}"
                >

                <div class="painting-title">
                    ${escapeHtml(painting.title)}
                </div>

            `;


            card.addEventListener(
                "click",
                () => openViewer(index)
            );


            list.appendChild(card);

        });

    })

    .catch(error => {

        console.error(error);

        document.getElementById("message").textContent =
            "Sorry — templates could not be loaded.";

    });



/* OPEN TEMPLATE */

function openViewer(index) {

    const painting =
        paintings[index];


    document.getElementById("fullImage").src =
        painting.template;


    document.getElementById("fullImage").alt =
        painting.title;


    document.getElementById("fullTitle").textContent =
        painting.title;


    document.getElementById("downloadButton").href =
        painting.template;


    document.getElementById("viewer").style.display =
        "block";

}



/* CLOSE VIEWER */

document
    .getElementById("closeViewer")
    .addEventListener(
        "click",
        closeViewer
    );


document
    .getElementById("viewer")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeViewer();

            }

        }
    );


function closeViewer() {

    document.getElementById("viewer").style.display =
        "none";

}



function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}

</script>
</body>
</html>
