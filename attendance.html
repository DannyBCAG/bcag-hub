g<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance</title>
<style>
body{font-family:Arial,sans-serif;font-size:22px;line-height:2;padding:30px;max-width:650px;margin:auto}
h1{font-size:36px;margin-bottom:40px}
.box{background:#f5f5f5;padding:25px;border-radius:15px;margin-bottom:50px}
input{font-size:22px;padding:18px;width:100%;border-radius:12px;border:2px solid #144FA3;margin:20px 0;box-sizing:border-box}
button{font-size:20px;padding:18px 28px;border-radius:30px;border:none}
.btn-blue{background:#144FA3;color:white;width:100%}
.btn-green{background:#2E9E44;color:white}
.btn-red{background:#D92D20;color:white}
.btn-grey{background:#e0e0e0;color:black}
.day-row{padding:30px 0;border-bottom:1px solid #ddd}
.day-title{font-size:22px;font-weight:bold;margin-bottom:20px}
.buttons{display:flex;gap:20px;margin-top:15px}
.buttons button{flex:1}
.home-btn{margin-top:60px;background:#144FA3;color:white;width:100%;padding:22px;font-size:24px}
</style>
</head>
<body>
<h1>Attendance</h1>
<div class="box" id="nameBox">
<div>Enter your name once:</div>
<input id="nameInput" placeholder="D Collier">
<button class="btn-blue" onclick="saveName()">Save Name</button>
</div>
<div id="savedInfo" style="display:none;margin-bottom:40px;background:#e8f5e9;padding:20px;border-radius:12px;">
You are: <b><span id="savedName"></span></b><br><br>
<a href="#" onclick="changeName();return false;">Change name</a>
</div>
<div id="list"></div>
<button class="home-btn" onclick="window.location.href='members.html'">Home</button>
<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyWHfyVjraKYJJQf6c0Q2nYKvMPIDhNr6R_nuWXeTmQYhmV_JOVwtNLwiM_UGU9MDHo/exec";
var startDate = new Date(2027,0,6);
var myName = localStorage.getItem('attendance_name') || '';
var myChoices = {};
try{myChoices = JSON.parse(localStorage.getItem('attendance_choices') || '{}')}catch(e){}
function formatDate(d){return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function render(){
  document.getElementById('savedName').textContent = myName;
  document.getElementById('savedInfo').style.display = myName? 'block' : 'none';
  document.getElementById('nameBox').style.display = myName? 'none' : 'block';
  var html = '';
  for(var i=0;i<12;i++){
    var d = new Date(startDate);
    d.setDate(startDate.getDate()+i*7);
    var dateStr = iso(d);
    var choice = myChoices[dateStr] || '';
    var comingClass = choice==='coming'? 'btn-green' : 'btn-blue';
    var cantClass = choice==='cant'? 'btn-red' : 'btn-blue';
    if(choice==='cant') comingClass='btn-grey';
    if(choice==='coming') cantClass='btn-grey';
    html += '<div class="day-row"><div class="day-title">'+formatDate(d)+'</div><div class="buttons"><button class="'+comingClass+'" onclick="choose(\''+dateStr+'\',\'coming\')">Coming</button><button class="'+cantClass+'" onclick="choose(\''+dateStr+'\',\'cant\')">Can\'t Come</button></div></div>';
  }
  document.getElementById('list').innerHTML = html;
}
function saveName(){
  var v = document.getElementById('nameInput').value.trim();
  if(!v) return;
  myName = v;
  localStorage.setItem('attendance_name', myName);
  render();
}
function changeName(){localStorage.removeItem('attendance_name');myName='';render();}
function choose(date,status){
  if(!myName){alert('Please enter your name first');return;}
  myChoices[date]=status;
  localStorage.setItem('attendance_choices', JSON.stringify(myChoices));
  render();
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({name:myName,date:date,status:status})});
}
render();
</script>
</body>
</html>
