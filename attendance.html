<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance - BCAG</title>
<style>
body{font-family:Arial,sans-serif;font-size:22px;line-height:1.6;padding:24px;max-width:680px;margin:0 auto;background:#fff}
h1{font-size:40px;color:#144FA3;margin:10px 0 5px 0}
.topmsg{background:#f0f5ff;border:2px solid #144FA3;border-radius:15px;padding:22px;margin:20px 0 30px 0;font-size:22px}
.namebox{background:#fff;border:2px solid #ddd;border-radius:15px;padding:22px;margin-bottom:30px}
.namebox input{font-size:22px;padding:16px;width:100%;border-radius:12px;border:2px solid #144FA3;box-sizing:border-box;margin-top:12px}
.row{background:#f9f9f9;border:1px solid #e5e5e5;border-radius:18px;padding:22px;margin-bottom:18px}
.date{font-size:21px;font-weight:800;margin-bottom:14px}
.btns{display:flex;gap:14px}
.btns button{flex:1;padding:18px 10px;border-radius:30px;border:none;font-size:20px;font-weight:800}
.b-blue{background:#144FA3;color:white}
.b-green{background:#2E9E44;color:white}
.b-red{background:#D92D20;color:white}
.b-grey{background:#e6e6e6;color:#777}
.home{width:100%;margin-top:40px;padding:22px;font-size:22px;font-weight:800;background:#144FA3;color:white;border-radius:15px;border:none}
</style>
</head>
<body>

<h1>Attendance</h1>
<div class="topmsg">
<b>Please indicate your attendance</b><br>
Classes start Wednesday 6th January 2027.<br>
Tap Coming or Can't Come for each week.
</div>

<div class="namebox" id="nameBox"></div>
<div id="list"></div>
<button class="home" onclick="window.location.href='members.html'">← Back to Home</button>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyWHfyVjraKYJJQf6c0Q2nYKvMPIDhNr6R_nuWXeTmQYhmV_JOVwtNLwiM_UGU9MDHo/exec";
var dates = [
  ["2027-01-06","Wednesday 6th January 2027"],
  ["2027-01-13","Wednesday 13th January 2027"],
  ["2027-01-20","Wednesday 20th January 2027"],
  ["2027-01-27","Wednesday 27th January 2027"],
  ["2027-02-03","Wednesday 3rd February 2027"],
  ["2027-02-10","Wednesday 10th February 2027"],
  ["2027-02-17","Wednesday 17th February 2027"],
  ["2027-02-24","Wednesday 24th February 2027"],
  ["2027-03-03","Wednesday 3rd March 2027"],
  ["2027-03-10","Wednesday 10th March 2027"],
  ["2027-03-17","Wednesday 17th March 2027"],
  ["2027-03-24","Wednesday 24th March 2027"]
];
var myName = localStorage.getItem('attendance_name') || '';
var myChoices = {};
try{ myChoices = JSON.parse(localStorage.getItem('attendance_choices')||'{}'); }catch(e){}
function renderName(){
  var box = document.getElementById('nameBox');
  if(myName){
    box.innerHTML = "You are: <b>"+myName+"</b><br><br><a href='#' onclick='changeName();return false;' style='color:#144FA3;font-weight:bold'>Change name</a>";
  }else{
    box.innerHTML = "Enter your name once:<br><input id='nameInput' placeholder='D Collier'><br><br><button class='b-blue' style='width:100%' onclick='saveName()'>Save Name</button>";
  }
}
function renderList(){
  var out = "";
  for(var i=0;i<dates.length;i++){
    var iso = dates[i][0];
    var pretty = dates[i][1];
    var choice = myChoices[iso] || '';
    var cClass = "b-blue";
    var nClass = "b-blue";
    if(choice==="coming"){ cClass="b-green"; nClass="b-grey"; }
    if(choice==="cant"){ cClass="b-grey"; nClass="b-red"; }
    out += "<div class='row'><div class='date'>"+pretty+"</div><div class='btns'><button class='"+cClass+"' onclick=\"choose('"+iso+"','coming')\">Coming</button><button class='"+nClass+"' onclick=\"choose('"+iso+"','cant')\">Can't Come</button></div></div>";
  }
  document.getElementById('list').innerHTML = out;
}
function saveName(){
  var v = document.getElementById('nameInput').value.trim();
  if(!v){ alert('Please type your name'); return; }
  myName = v;
  localStorage.setItem('attendance_name', myName);
  renderName(); renderList();
}
function changeName(){localStorage.removeItem('attendance_name');myName='';renderName();renderList();}
function choose(date,status){
  if(!myName){ alert('Please enter your name first'); return; }
  myChoices[date]=status;
  localStorage.setItem('attendance_choices', JSON.stringify(myChoices));
  renderList();
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({name:myName,date:date,status:status})});
}
renderName();renderList();
</script>
</body>
</html>
