<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance</title>
<style>
body{font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:700px;margin:0 auto;padding:16px;background:#fff}
.top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.back{color:#144FA3;text-decoration:none;font-size:32px;line-height:1}
h1{color:#144FA3;font-size:22px;margin:0;font-weight:900}
.input{width:100%;padding:16px;border:2px solid #D6E3FF;border-radius:12px;font-size:18px}
.help{font-size:12px;color:#666;margin-top:6px}
.dateLabel{color:#144FA3;font-weight:900;margin:18px 0 8px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.btn{height:56px;border-radius:12px;border:none;font-weight:800;font-size:15px;background:#144FA3;color:#fff}
.btn.coming{background:#1FA971}
.btn.cant{background:#D93F3F}
.saveBtn{width:100%;height:64px;border-radius:16px;background:#144FA3;color:#fff;font-weight:900;font-size:18px;border:none;margin-top:24px}
.note{font-size:13px;color:#666;text-align:center;margin-top:8px}
.saved{background:#E8F8F0;border:1px solid #C7EAD9;border-radius:12px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<div class="top"><a class="back" href="index.html">←</a><h1>Attendance</h1></div>
<div id="nameArea">
<p style="font-size:14px">Enter your name once — we remember it</p>
<input id="nameInput" class="input" placeholder="D Collier">
<div class="help">Initial + surname e.g. D Collier — you only need to do this once</div>
</div>
<div id="savedArea" style="display:none"></div>
<div id="dates"></div>
<button id="saveBtn" class="saveBtn">Save</button>
<div class="note">Choose your answers, then tap Save</div>
<script>
const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyWHfyVjraKYJJQf6c0Q2nYKvMPIDhNr6R_nuWXeTmQYhmV_JOVwtNLwiM_UGU9MDHo/exec";
function toISO(d){var y=d.getFullYear();var m=String(d.getMonth()+1).padStart(2,'0');var day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function fmt(d){var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return 'Wed '+d.getDate()+' '+months[d.getMonth()]+' — Blackies 1-4pm';}
function next4Weds(){var t=new Date();t.setHours(0,0,0,0);var off=(3-t.getDay()+7)%7;var f=new Date(t);f.setDate(t.getDate()+off);return Array.from({length:4},function(_,i){var d=new Date(f);d.setDate(f.getDate()+i*7);return d;});}
var weds=next4Weds();
var name=localStorage.getItem("wc_name")||"";
var att={};try{att=JSON.parse(localStorage.getItem("wc_attendance")||"{}");}catch(e){}
var nameInput=document.getElementById("nameInput");
var nameArea=document.getElementById("nameArea");
var savedArea=document.getElementById("savedArea");
var datesDiv=document.getElementById("dates");
var saveBtn=document.getElementById("saveBtn");
function renderName(){if(name){nameArea.style.display="none";savedArea.style.display="block";savedArea.innerHTML='<div class="saved"><div>You are: <b>'+name+'</b> ✓</div><div style="font-size:12px;color:#444;margin-top:4px">Name saved — next time you won\'t need to type it.</div><div style="margin-top:8px"><a href="#" id="changeLink" style="color:#144FA3;font-size:13px">Not you? Change name</a></div></div>';document.getElementById("changeLink").onclick=function(e){e.preventDefault();localStorage.removeItem("wc_name");name="";nameInput.value="";nameArea.style.display="block";savedArea.style.display="none";nameInput.focus();};}else{nameArea.style.display="block";savedArea.style.display="none";}}
function renderDates(){datesDiv.innerHTML="";weds.forEach(function(d){var iso=toISO(d);var div=document.createElement("div");div.innerHTML='<div class="dateLabel">'+fmt(d)+'</div><div class="row"><button class="btn '+(att[iso]=='coming'?'coming':'')+'" data-iso="'+iso+'" data-val="coming">Coming</button><button class="btn '+(att[iso]=='cant'?'cant':'')+'" data-iso="'+iso+'" data-val="cant">Can\'t Come</button></div>';datesDiv.appendChild(div);});datesDiv.querySelectorAll("button").forEach(function(b){b.onclick=function(){var iso=b.dataset.iso;var val=b.dataset.val;att[iso]=val;localStorage.setItem("wc_attendance",JSON.stringify(att));saveBtn.textContent="Save";renderDates();};});}
nameInput.value=name;
renderName();renderDates();
saveBtn.onclick=function(){
  var n=(localStorage.getItem("wc_name")||nameInput.value||"").trim();
  if(!n){alert("Please enter your name e.g. D Collier");nameInput.focus();return;}
  localStorage.setItem("wc_name",n);name=n;renderName();
  var payload={name:n,attendance:att,timestamp:new Date().toISOString()};
  try{var raw=localStorage.getItem("wc_all_submissions");var all=raw?JSON.parse(raw):[];if(!Array.isArray(all))all=[];var idx=all.findIndex(function(s){return s.name.toLowerCase()===n.toLowerCase();});if(idx>=0)all[idx]=payload;else all.push(payload);localStorage.setItem("wc_all_submissions",JSON.stringify(all));}catch(e){}
  saveBtn.disabled=true;
  saveBtn.textContent="Saving...";
  fetch(GOOGLE_SHEET_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)})
    .then(function(){saveBtn.textContent="Saved ✓";saveBtn.disabled=false;})
    .catch(function(){saveBtn.textContent="Couldn't save — tap to try again";saveBtn.disabled=false;});
};
</script>
</body>
</html>
