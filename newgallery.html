<!DOCTYPE html>
<!-- BCAG NEW GALLERY TEST -->
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCAG Gallery Test</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #f5f1e8;
    font-family: Arial, sans-serif;
    color: #333;
}

h1 {
    text-align: center;
    margin: 5px 0 18px;
    font-size: 26px;
}

#gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.painting {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    cursor: pointer;
}

.painting img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    display: block;
    background: white;
}

.painting-title {
    padding: 8px 5px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
}

#message {
    text-align: center;
    padding: 30px 10px;
    font-size: 17px;
}

#viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    overflow-y: auto;
    padding: 20px;
}

#viewer-content {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
}

#closeViewer {
    position: fixed;
    top: 12px;
    right: 18px;
    color: white;
    font-size: 34px;
    cursor: pointer;
    z-index: 1001;
}

#fullImage {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
    margin-top: 35px;
}

#fullTitle {
    color: white;
    font-size: 21px;
    margin: 15px 0;
}

.viewer-button {
    display: inline-block;
    border: none;
    border-radius: 8px;
    padding: 13px 20px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
}

#downloadButton {
    background: white;
    color: #333;
}

#requestButton {
    background: #e7c98b;
    color: #333;
}

</style>

</head>


<body>

<h1>Gallery</h1>

<div id="message">
    Loading paintings...
</div>

<div id="gallery"></div>


<!-- FULL SIZE VIEW -->

<div id="viewer">

    <div id="closeViewer">&times;</div>

    <div id="viewer-content">

        <img
            id="fullImage"
            src=""
            alt=""
        >

        <div id="fullTitle"></div>

        <a
            id="downloadButton"
            class="viewer-button"
            href=""
            target="_blank"
            download
        >
            Download
        </a>

        <button
            id="requestButton"
            class="viewer-button"
            onclick="requestTemplate()"
        >
            Request Template
        </button>

    </div>

</div>


<script>


/* GOOGLE APPS SCRIPT */

const API_URL =
"https://script.google.com/macros/s/AKfycbxCKC-egEBX1XiEgpiodtP-8h_phDuK87A-W97e_tz_mO9OVYhN0zY0fHg56ZhlO6ZF/exec";


let paintings = [];


/* LOAD GALLERY */

fetch(API_URL)

    .then(response => response.json())

    .then(data => {

        paintings = data;

        const gallery =
            document.getElementById("gallery");

        const message =
            document.getElementById("message");


        message.style.display = "none";


        if (!paintings.length) {

            message.style.display = "block";

            message.textContent =
                "No paintings found.";

            return;

        }


        paintings.forEach((painting, index) => {

            const card =
                document.createElement("div");


            card.className =
                "painting";


            card.innerHTML = `

                <img
                    src="${painting.image}"
                    alt="${escapeHtml(painting.title)}"
                >

                <div class="painting-title">
                    ${escapeHtml(painting.title)}
                </div>

            `;


            card.addEventListener(
                "click",
                () => openViewer(index)
            );


            gallery.appendChild(card);

        });

    })

    .catch(error => {

        console.error(error);

        document.getElementById("message").textContent =
            "Sorry — the gallery could not be loaded.";

    });



/* OPEN PAINTING */

function openViewer(index) {

    const painting =
        paintings[index];


    document.getElementById("fullImage").src =
        painting.image;


    document.getElementById("fullImage").alt =
        painting.title;


    document.getElementById("fullTitle").textContent =
        painting.title;


    document.getElementById("downloadButton").href =
        painting.image;


    document.getElementById("viewer").style.display =
        "block";

}



/* CLOSE VIEWER */

document
    .getElementById("closeViewer")
    .addEventListener(
        "click",
        closeViewer
    );


document
    .getElementById("viewer")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeViewer();

            }

        }
    );


function closeViewer() {

    document.getElementById("viewer").style.display =
        "none";

}



/* ESCAPE HTML */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}



/* REQUEST TEMPLATE */
function requestTemplate() {

    const title =
        document
            .getElementById("fullTitle")
            .textContent;


    const name =
        prompt("Please enter your name:");


    if (!name || !name.trim()) {

        return;

    }


    const memberName =
        name.trim();


    /*
     * Send the request using GET.
     */

    const requestURL =
        API_URL +
        "?title=" +
        encodeURIComponent(title) +
        "&memberName=" +
        encodeURIComponent(memberName);


    fetch(requestURL)

        .then(response => response.json())

        .then(result => {

            console.log(
                "Request response:",
                result
            );


            if (result.success) {

                alert(
                    "Template request sent successfully."
                );

            } else {

                alert(
                    "Sorry, the request could not be sent."
                );

            }

        })

        .catch(error => {

            console.error(error);

            alert(
                "Sorry, there was a problem sending the request."
            );

        });

}



</script>

</body>

</html>
