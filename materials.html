<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCAG Materials</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f3ed;
    color: #333;
}

.header {
    background: #ffffff;
    padding: 20px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

.materials {
    padding: 15px;
    max-width: 700px;
    margin: auto;
}

.intro-note {
    font-style: italic;
    text-align: center;
    margin-bottom: 20px;
    color: #555;
    font-size: 16px;
}

.category-heading {
    background: #e8ded0;
    color: #5a4a3a;
    font-weight: bold;
    font-size: 18px;
    padding: 10px 16px;
    border-radius: 8px;
    margin: 20px 0 10px 0;
}

.category-heading:first-of-type {
    margin-top: 0;
}

.material {
    background: white;
    margin-bottom: 10px;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.10);
    font-size: 18px;
}

.loading {
    text-align: center;
    padding: 30px;
    font-size: 18px;
}
</style>
</head>

<body>
<a class="back-link" href="members.html" style="display: inline-block; margin-bottom: 15px; color: #333; text-decoration: none; font-size: 16px;">&larr; Back</a>
<div class="header">
    BCAG Materials
</div>

<div id="materials" class="materials">
    <div class="loading">Loading materials...</div>
</div>

<script>

const MATERIALS_URL = "https://script.google.com/macros/s/AKfycbzSpNjzeTOGuzHLX2HMflGQGWJzgpaL9blzbgxcM6HATNyY3x2X0c6ISu41N74Bx0dz/exec";

// The order categories should appear in
const CATEGORY_ORDER = ["Paper", "Paint", "Brushes", "Pens and pencils", "Miscellaneous"];

fetch(MATERIALS_URL, {
    mode: "cors"
})
.then(response => response.json())
.then(data => {

    const container = document.getElementById("materials");
    container.innerHTML = "";

    // Intro note at the top
    const intro = document.createElement("div");
    intro.className = "intro-note";
    intro.textContent = "These are my recommended watercolour materials and pretty much what I use.";
    container.appendChild(intro);

    // Group items by category
    const groups = {};

    data.forEach(row => {
        let itemText, category;

        if (typeof row === "string") {
            itemText = row;
            category = "Miscellaneous";
        } else {
            itemText = row.Item || row.item || "";
            category = row.Category || row.category || "Miscellaneous";
        }

        if (!groups[category]) {
            groups[category] = [];
        }
        groups[category].push(itemText);
    });

    // Work out the order: named categories first (in the order given),
    // then any other categories not in the list, alphabetically
    const allCategories = Object.keys(groups);
    const orderedCategories = CATEGORY_ORDER.filter(cat => allCategories.includes(cat));
    const extraCategories = allCategories
        .filter(cat => !CATEGORY_ORDER.includes(cat))
        .sort();
    const finalOrder = orderedCategories.concat(extraCategories);

    // Render each group with its heading
    finalOrder.forEach(category => {
        const heading = document.createElement("div");
        heading.className = "category-heading";
        heading.textContent = category;
        container.appendChild(heading);

        groups[category].forEach(itemText => {
            const card = document.createElement("div");
            card.className = "material";
            card.textContent = itemText;
            container.appendChild(card);
        });
    });

})
.catch(error => {

    document.getElementById("materials").innerHTML =
        "<div class='loading'>Sorry, the materials could not be loaded.</div>";

    console.error(error);

});

</script>

</body>
</html>
