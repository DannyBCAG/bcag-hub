<!DOCTYPE html>
<html lang="en">
<head>

<link rel="apple-touch-icon" href="https://i.postimg.cc/Kzr3r4n8/bcag-main-transparent.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCAG Art Group Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f7f1e8;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 35px 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
}

.logo {
    width: 150px;
    height: 150px;
    object-fit: contain;
    margin-bottom: 10px;
}

h1 {
    margin: 5px 0 10px;
    color: #333;
}

p {
    color: #666;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
}

.message {
    margin-top: 15px;
    color: #c00;
    min-height: 20px;
}
</style>
</head>

<body>

<div class="login-box">

    <img
        class="logo"
        src="https://i.postimg.cc/Kzr3r4n8/bcag-main-transparent.png"
        alt="BCAG Art Group"
    >

    <h1>BCAG Art Group</h1>

    <p>Enter your password to continue.</p>

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="doLogin()">Log In</button>

    <div id="message" class="message"></div>

</div>

<script>
if (localStorage.getItem("bcagLoggedIn") === "true") {
    window.location.href = "members.html";
}
const DB_URL = "https://rclomczdigsukcswnnju.supabase.co";

const DB_KEY = "sb_publishable_4rPNlWAWyjl-969TZ7C64g_SzY86As2";

const BCAG_DATABASE = window.supabase.createClient(
    DB_URL,
    DB_KEY
);

function doLogin() {

    const enteredPassword =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("message");

    message.textContent = "";

    if (!enteredPassword) {
        message.textContent = "Please enter your password.";
        return;
    }

    checkPassword(enteredPassword);
}

async function checkPassword(enteredPassword) {

    const message =
        document.getElementById("message");

    try {

        const result =
            await BCAG_DATABASE
            .from("app_settings")
            .select("members_password, admin_password")
            .eq("id", 1)
            .single();

        if (result.error) {

            console.error(result.error);

            message.textContent =
                result.error.message;

            return;
        }

        const settings = result.data;

        if (enteredPassword === settings.admin_password) {

            localStorage.setItem("bcagLoggedIn", "true");
            localStorage.setItem("bcagRole", "admin");

            window.location.href = "members.html";

            return;
        }

        if (enteredPassword === settings.members_password) {

            localStorage.setItem("bcagLoggedIn", "true");
            localStorage.setItem("bcagRole", "member");

            window.location.href = "members.html";

            return;
        }

        message.textContent =
            "Incorrect password. Please try again.";

    } catch (problem) {

        console.error(problem);

        message.textContent =
            problem.message || "Unable to check password.";

    }
}

document
.getElementById("password")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        doLogin();
    }

});

</script>

</body>
</html>
