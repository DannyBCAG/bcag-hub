<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCAG Art Group Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="apple-touch-icon"
href="https://i.postimg.cc/Kzr3r4n8/bcag-main-transparent.png">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f7f1e8;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 35px 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
}

.logo {
    width: 150px;
    height: 150px;
    object-fit: contain;
    margin-bottom: 10px;
}

h1 {
    margin: 5px 0 10px;
    color: #333;
}

p {
    color: #666;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.message {
    margin-top: 15px;
    color: #c00;
    min-height: 20px;
}
</style>
</head>

<body>

<div class="login-box">

    <img
        class="logo"
        src="https://i.postimg.cc/Kzr3r4n8/bcag-main-transparent.png"
        alt="BCAG Art Group"
    >

    <h1>BCAG Art Group</h1>

    <p>Enter your password to continue.</p>

    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button onclick="login()">Log In</button>

    <div id="message" class="message"></div>

</div>

<script>

const SUPABASE_URL =
"https://rclomczdigsukcswnnju.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4rPNlWAWyjl-969TZ7C64g_SzY86As2";

const bcagDB = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function checkExistingLogin() {

    const loggedIn = localStorage.getItem("bcagLoggedIn");

    if (loggedIn === "true") {
        window.location.href = "members.html";
    }
}

async function login() {

    const password =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("message");

    message.textContent = "";

    if (!password) {
        message.textContent =
            "Please enter your password.";
        return;
    }

    try {

        const { data, error } =
            await supabaseClient
            .from("app_settings")
            .select("members_password, admin_password")
            .eq("id", 1)
            .single();

        if (error) {
            console.error(error);
            message.textContent =
                error.message;
            return;
        }

        if (password === data.admin_password) {

            localStorage.setItem(
                "bcagLoggedIn",
                "true"
            );

            localStorage.setItem(
                "bcagRole",
                "admin"
            );

            window.location.href =
                "members.html";

            return;
        }

        if (password === data.members_password) {

            localStorage.setItem(
                "bcagLoggedIn",
                "true"
            );

            localStorage.setItem(
                "bcagRole",
                "member"
            );

            window.location.href =
                "members.html";

            return;
        }

        message.textContent =
            "Incorrect password. Please try again.";

    } catch (error) {

        console.error(error);

        message.textContent =
            error.message ||
            "Unable to check password.";

    }
}

document
.getElementById("password")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        login();
    }

});

checkExistingLogin();

</script>

</body>
</html>
