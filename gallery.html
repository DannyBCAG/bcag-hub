1. <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCAG Portal</title>
    <!-- Basic mobile app properties -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --lavender: #E6E6FA;
            --deep-blue: #0A2540;
            --white: #FFFFFF;
            --grey: #F4F4F9;
            --dark-grey: #333333;
            --green: #2ECC71;
            --yellow: #F1C40F;
            --red: #E74C3C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--white);
            color: var(--dark-grey);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 1. SPLASH SCREEN STYLES */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--lavender);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .splash-logo-container {
            width: 120px;
            height: 120px;
            background-color: var(--deep-blue);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .splash-logo-placeholder {
            color: var(--white);
            font-size: 40px;
            font-weight: bold;
        }

        #splash-screen h1 {
            color: var(--deep-blue);
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        #splash-screen p {
            color: var(--deep-blue);
            font-size: 18px;
            line-height: 1.5;
            max-width: 400px;
            margin-bottom: 40px;
        }

        .btn-enter {
            background-color: var(--deep-blue);
            color: var(--white);
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(10,37,64,0.3);
            transition: transform 0.2s ease;
        }

        .btn-enter:active {
            transform: scale(0.95);
        }

        /* 2. LOCK SCREEN STYLES */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--white);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            z-index: 9998;
        }

        .lock-container {
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .lock-container h2 {
            color: var(--deep-blue);
            margin-bottom: 25px;
            font-size: 22px;
        }

        .lock-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid var(--lavender);
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }

        .lock-input:focus {
            border-color: var(--deep-blue);
        }

        .btn-login {
            width: 100%;
            background-color: var(--deep-blue);
            color: var(--white);
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }

        .error-message {
            color: var(--red);
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* 3. MAIN DASHBOARD STYLES */
        #app-content {
            display: none;
            padding-bottom: 80px; /* space for sneak peek or keys */
        }

        .header-banner {
            text-align: center;
            padding: 30px 20px;
            background-color: var(--white);
            border-bottom: 1px solid var(--lavender);
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background-color: var(--deep-blue);
            border-radius: 18px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: bold;
            font-size: 28px;
        }

        .header-banner h2 {
            color: var(--deep-blue);
            font-size: 26px;
            margin-bottom: 8px;
        }

        .header-banner p {
            font-size: 15px;
            color: #555;
            line-height: 1.4;
            max-width: 450px;
            margin: 0 auto;
        }

        /* GRID LAYOUTS */
        .dashboard-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .menu-btn {
            background-color: var(--grey);
            border: none;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .menu-btn:active {
            background-color: var(--lavender);
        }

        .btn-icon-img {
            width: 50px;
            height: 50px;
            background-color: var(--deep-blue);
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 20px;
        }

        .menu-btn span {
            font-size: 15px;
            font-weight: 600;
            color: var(--deep-blue);
        }

        /* Full width News Row */
        .news-row {
            grid-column: span 2;
            padding: 15px 20px;
        }

        /* SUB PAGES CLOSING & HEADER */
        .sub-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--white);
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        .sub-header {
            padding: 20px;
            background-color: var(--deep-blue);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--white);
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .sub-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* FIXED SNEAK PEEK NOTICES CONTAINER */
        #news-sneak-peek {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--deep-blue);
            color: var(--white);
            padding: 12px 20px;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            z-index: 90;
        }

        /* STICKY CALENDAR KEY FOOTER */
        .sticky-footer-key {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--grey);
            border-top: 1px solid var(--lavender);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            font-size: 13px;
            font-weight: bold;
            z-index: 110;
        }

        .key-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block;}
        .dot.green { background-color: var(--green); }
        .dot.yellow { background-color: var(--yellow); }
        .dot.red { background-color: var(--red); }

        /* INTERACTIVE ITEMS & LISTS */
        .materials-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--lavender);
            font-size: 16px;
        }

        .materials-list-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--deep-blue);
        }

        .calendar-timeline-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background-color: var(--grey);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        /* SIMULATED DATA FOR GALLERY PROTOTYPE */
        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
