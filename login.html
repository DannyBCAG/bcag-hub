<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCAG Members Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f7f1e8;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
}
.login-box {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 35px 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 4px 18px rgba(0,0,0,0.12);
}
.logo {
  width: 120px;
  margin-bottom: 15px;
}
h1 {
  margin: 5px 0 10px;
  color: #333;
}
p {
  color: #666;
  margin-bottom: 25px;
}
input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
.message {
  margin-top: 15px;
  color: #c00;
}
.back {
  display: block;
  margin-top: 20px;
  color: #555;
  text-decoration: none;
}
</style>
</head>
<body>
<div class="login-box">
<img class="logo"
src="https://i.postimg.cc/Kzr3r4n8/bcag-main-transparent.png">
<h1>BCAG Members</h1>
<p>Please log in to access the members area.</p>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Log In</button>
<div id="message" class="message"></div>
<a class="back" href="index.html">← Back to Home</a>
</div>
<script>
const SUPABASE_URL = "https://rclomczdigsukcswnnju.supabase.co";
const SUPABASE_KEY = "sb_publishable_4rPNlWAWyjl-969TZ7C64g_SzY86As2";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");
  message.textContent = "";
  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });
  if (error) {
    message.textContent = "Login failed. Please check your email and password.";
    return;
  }
  window.location.href = "members.html";
}
</script>
</body>
</html>
