<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCAG Members Login</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f7f1e8;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
}

.login-box {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 35px 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 4px 18px rgba(0,0,0,0.12);
}

.logo {
  width: 120px;
  margin-bottom: 15px;
}

h1 {
  margin: 5px 0 10px;
  color: #333;
}

p {
  color: #666;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.back {
  display: block;
  margin-top: 20px;
  color: #555;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">

<img class="logo"
src="https://i.postimg.cc/Kzr3r4n8/bcag-main-transparent.png">

<h1>BCAG Members</h1>

<p>Please log in to access the members area.</p>

<input type="text" placeholder="Email or username">

<input type="password" placeholder="Password">

<button>Log In</button>

<a class="back" href="index.html">← Back to Home</a>

</div>

</body>
</html>
