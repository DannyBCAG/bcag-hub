<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export templates</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body { font-family: sans-serif; background: #ece6f5; margin: 0; padding: 12px; }
  .back { color: #1a4b8c; font-weight: bold; text-decoration: none; }
  h2 { text-align: center; color: #1a4b8c; }
  button { background: #1a4b8c; color: #fff; border: 0; border-radius: 20px; padding: 12px 24px; font-size: 16px; display: block; margin: 12px auto; }
  button:disabled { opacity: 0.5; }
  #log { background: #fff; border-radius: 10px; padding: 10px; font-size: 14px; white-space: pre-wrap; }
  #dl { display: none; text-align: center; font-size: 20px; font-weight: bold; margin: 16px; color: #1a4b8c; }
  .box { background: #fff; border-radius: 14px; padding: 12px; margin: 14px 0; text-align: center; }
  .box h3 { margin: 4px 0 8px; color: #1a4b8c; font-size: 17px; }
  .box input { width: 90px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
  .small { font-size: 13px; color: #555; margin: 4px 0; }
</style>
</head>
<body>
<a class="back" href="admin.html">&larr; Back</a>
<h2>Export templates</h2>

<div class="box">
  <h3>Save to Drive (Master Templates)</h3>
  <p class="small">Mirrored, numbered, saved straight into your Master Templates folder.</p>
  <button onclick="saveToDrive('new')">Add new ones only</button>
  <p class="small">Or choose numbers (replaces those if already there):</p>
  From <input id="from" type="number" inputmode="numeric"> To <input id="to" type="number" inputmode="numeric">
  <button onclick="saveToDrive('range')">Save this range</button>
  <button onclick="saveToDrive('all')" style="background:#777;">Redo ALL</button>
</div>

<div class="box">
  <h3>Or download a zip</h3>
  <button id="go" onclick="start()">Make zip of mirrored templates</button>
  <a id="dl" download="templates-to-print.zip">Download the zip</a>
</div>

<div id="log">Ready.</div>

<script>
if (localStorage.getItem('bcagRole') !== 'admin') {
  window.location.href = 'members.html';
}

var LIMIT = 0; // 5 = test with the first 5 templates. Change to 0 for all.
var LISTURL = 'https://script.google.com/macros/s/AKfycbzmrocbRQlGP3AcWtNsLItH3LDQnqWJZ2MSeac1CgM4TJRdUNvjJERAoY9rol9urV7e/exec?type=templates';
var EXPORTURL = 'https://script.google.com/macros/s/AKfycbzc6bqoG6bampLTCFyWfV3n2f1tytV5WJ7aQ8MhlPOJGHGJwBRwUFt8QLmCssRkdLLq/exec';

function log(t) { document.getElementById('log').textContent += '\n' + t; }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function loadImage(src) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = function () { reject(new Error('picture failed to load')); };
    img.src = src;
  });
}

// how much dark line work is in a square (0 = empty, 1 = full)
function inkIn(x, left, top, size) {
  var d = x.getImageData(left, top, size, size).data;
  var ink = 0;
  for (var i = 0; i < d.length; i += 4) {
    if (d[i] + d[i + 1] + d[i + 2] < 600) { ink++; }
  }
  return ink / (size * size);
}

function mirrorToJpeg(img, number) {
  return new Promise(function (resolve, reject) {
    var c = document.createElement('canvas');
    var w = c.width = img.naturalWidth;
    var h = c.height = img.naturalHeight;
    var x = c.getContext('2d');
    x.fillStyle = '#fff';
    x.fillRect(0, 0, w, h);
    x.translate(w, 0);
    x.scale(-1, 1);
    x.drawImage(img, 0, 0);
    x.setTransform(1, 0, 0, 1, 0, 0);

    // circle size and the square we check in each corner
    var s = Math.round(Math.min(w, h) * 0.09);
    var m = Math.round(Math.min(w, h) * 0.02);
    var box = s + 2 * m;
    var corners = [
      { name: 'bottom-right', left: w - box, top: h - box },
      { name: 'bottom-left', left: 0, top: h - box },
      { name: 'top-right', left: w - box, top: 0 },
      { name: 'top-left', left: 0, top: 0 }
    ];
    var LIMITINK = 0.01;
    var pick = corners[0];
    for (var k = 0; k < corners.length; k++) {
      corners[k].ink = inkIn(x, corners[k].left, corners[k].top, box);
    }
    if (corners[0].ink >= LIMITINK) {
      var best = null;
      for (var j = 1; j < corners.length; j++) {
        if (best === null || corners[j].ink < best.ink) { best = corners[j]; }
      }
      if (best.ink < LIMITINK) { pick = best; }
    }

    // outline circle, black number
    var cx = pick.left + box / 2;
    var cy = pick.top + box / 2;
    x.fillStyle = '#fff';
    x.beginPath();
    x.arc(cx, cy, s / 2, 0, Math.PI * 2);
    x.fill();
    x.lineWidth = Math.max(2, Math.round(s * 0.05));
    x.strokeStyle = '#000';
    x.stroke();
    x.fillStyle = '#000';
    x.font = 'bold ' + Math.round(s * 0.42) + 'px sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(String(number), cx, cy);

    try {
      c.toBlob(function (b) {
        if (b) { resolve({ blob: b, corner: pick.name }); } else { reject(new Error('could not make jpeg')); }
      }, 'image/jpeg', 0.92);
    } catch (e) { reject(e); }
  });
}

function blobToBase64(blob) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
    fr.onerror = function () { reject(new Error('could not read picture')); };
    fr.readAsDataURL(blob);
  });
}

function setButtons(off) {
  var b = document.querySelectorAll('button');
  for (var i = 0; i < b.length; i++) { b[i].disabled = off; }
}

async function saveToDrive(mode) {
  var from = parseInt(document.getElementById('from').value, 10);
  var to = parseInt(document.getElementById('to').value, 10);
  if (mode === 'range' && (isNaN(from) || isNaN(to) || from > to)) {
    alert('Type a From number and a To number, e.g. 220 and 240.');
    return;
  }
  if (mode === 'all' && !confirm('This replaces EVERY template already in Master Templates. Continue?')) {
    return;
  }
  setButtons(true);
  document.getElementById('log').textContent = 'Getting the list...';
  try {
    var d = await (await fetch(LISTURL)).json();
    var list = d.templates;
    if (mode === 'new') {
      var ex = await (await fetch(EXPORTURL + '?action=list')).json();
      if (ex.error) { throw new Error(ex.error); }
      var have = {};
      ex.files.forEach(function (n) { have[n] = true; });
      list = list.filter(function (t) { return !have[t.number + '.jpg']; });
    } else if (mode === 'range') {
      list = list.filter(function (t) { var n = parseInt(t.number, 10); return n >= from && n <= to; });
    }
    if (list.length === 0) {
      log('Nothing to do - no matching templates.');
      setButtons(false);
      return;
    }
    log(list.length + ' to save.');
    var done = 0;
    var failed = [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var fileId = p.thumb.match(/id=([^&]+)/)[1];
      var ok = false;
      var why = '';
      var corner = '';
      for (var tries = 0; tries < 3 && !ok; tries++) {
        try {
          var r = await (await fetch(EXPORTURL + '?id=' + fileId)).json();
          if (r.error) { throw new Error(r.error); }
          var img = await loadImage('data:' + r.mime + ';base64,' + r.data);
          var res = await mirrorToJpeg(img, p.number);
          var b64 = await blobToBase64(res.blob);
          var pr = await (await fetch(EXPORTURL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ name: p.number + '.jpg', data: b64 })
          })).json();
          if (pr.error) { throw new Error(pr.error); }
          corner = res.corner;
          ok = true;
          done++;
        } catch (e) {
          why = e.message;
          await wait(1500);
        }
      }
      if (!ok) { failed.push(p.number); }
      log('Template ' + p.number + (ok ? ' saved to Drive (circle: ' + corner + ')' : ' FAILED (' + why + ')'));
    }
    log('Finished: ' + done + ' saved' + (failed.length ? ', failed: ' + failed.join(', ') : '') + '.');
  } catch (e) {
    log('Error: ' + e.message);
  }
  setButtons(false);
}

async function start() {
  document.getElementById('go').disabled = true;
  document.getElementById('dl').style.display = 'none';
  document.getElementById('log').textContent = 'Getting the list...';
  try {
    var d = await (await fetch(LISTURL)).json();
    var list = d.templates;
    if (LIMIT > 0) { list = list.slice(0, LIMIT); }
    var zip = new JSZip();
    var done = 0;
    var failed = [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var fileId = p.thumb.match(/id=([^&]+)/)[1];
      var ok = false;
      var why = '';
      var corner = '';
      for (var tries = 0; tries < 3 && !ok; tries++) {
        try {
          var r = await (await fetch(EXPORTURL + '?id=' + fileId)).json();
          if (r.error) { throw new Error(r.error); }
          var img = await loadImage('data:' + r.mime + ';base64,' + r.data);
          var res = await mirrorToJpeg(img, p.number);
          zip.file(p.number + '.jpg', res.blob);
          corner = res.corner;
          ok = true;
          done++;
        } catch (e) {
          why = e.message;
          await wait(1500);
        }
      }
      if (!ok) { failed.push(p.number); }
      log('Template ' + p.number + (ok ? ' done (circle: ' + corner + ')' : ' FAILED (' + why + ')'));
    }
    if (done === 0) {
      log('Nothing could be saved.');
    } else {
      var out = await zip.generateAsync({ type: 'blob' });
      var a = document.getElementById('dl');
      a.href = URL.createObjectURL(out);
      a.style.display = 'block';
      log('Finished: ' + done + ' saved' + (failed.length ? ', failed: ' + failed.join(', ') : '') + '. Tap Download the zip.');
    }
  } catch (e) {
    log('Error: ' + e.message);
  }
  document.getElementById('go').disabled = false;
}
</script>
</body>
</html>
