<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template Requests</title>
<style>
  body { font-family: sans-serif; background: #ece6f5; margin: 0; padding: 12px; }
  .back { display: inline-block; margin-bottom: 8px; color: #1a4b8c; font-weight: bold; text-decoration: none; }
  h2 { text-align: center; color: #1a4b8c; margin: 4px 0 12px; }
  .row { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .info { font-size: 18px; color: #222; }
  .info b { color: #1a4b8c; }
  .del { background: #b33a3a; color: #fff; border: 0; border-radius: 16px; padding: 8px 16px; font-size: 15px; }
  #empty { text-align: center; color: #555; margin-top: 30px; font-size: 17px; }
</style>
</head>
<body>
<a class="back" href="members.html">&larr; Back</a>
<h2>Template Requests</h2>
<div id="list">Loading...</div>

<script>
if (localStorage.getItem('bcagRole') !== 'admin') {
  window.location.href = 'members.html';
}

var REQUESTS_URL = 'https://script.google.com/macros/s/AKfycbxwkGMuEaEAXL1TwVECnuf3MXMWSwiaCCWuyi69t1MFVU4ijjBEV7DTAiJuZ6HhaFjKhA/exec';

function loadRequests() {
  fetch(REQUESTS_URL).then(function (r) { return r.json(); }).then(function (d) {
    var box = document.getElementById('list');
    box.innerHTML = '';
    var list = d.requests || [];
    if (list.length === 0) {
      box.innerHTML = '<div id="empty">No template requests</div>';
      return;
    }
    list.forEach(function (req) {
      var row = document.createElement('div');
      row.className = 'row';

      var info = document.createElement('div');
      info.className = 'info';
      var b = document.createElement('b');
      b.textContent = 'No. ' + req.number;
      info.appendChild(b);
      info.appendChild(document.createTextNode('  ' + req.name));

      var btn = document.createElement('button');
      btn.className = 'del';
      btn.textContent = 'Delete';
      btn.onclick = function () { deleteRequest(req.id, row); };

      row.appendChild(info);
      row.appendChild(btn);
      box.appendChild(row);
    });
  });
}

function deleteRequest(id, row) {
  row.style.opacity = '0.4';
  fetch(REQUESTS_URL + '?action=delete&id=' + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function () { loadRequests(); });
}

loadRequests();
</script>
</body>
</html>
