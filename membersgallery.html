<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCAG Members Gallery</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #f5f1e8;
    font-family: Arial, sans-serif;
    color: #333;
}

h1 {
    text-align: center;
    margin: 5px 0 18px;
    font-size: 26px;
}

.back-link {
    display: inline-block;
    margin-bottom: 15px;
    color: #333;
    text-decoration: none;
    font-size: 16px;
}

#message {
    text-align: center;
    padding: 30px 10px;
    font-size: 17px;
}

#gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    max-width: 700px;
}

.painting {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    cursor: pointer;
}

.painting img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    display: block;
    background: white;
}

.painting-artist {
    padding: 8px 5px;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
}

/* FULL SIZE VIEWER */

#viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    overflow-y: auto;
    padding: 20px;
}

#viewer-content {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
}

#closeViewer {
    position: fixed;
    top: 12px;
    right: 18px;
    color: white;
    font-size: 34px;
    cursor: pointer;
    z-index: 1001;
}

#fullImage {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
    margin-top: 35px;
}

#fullDetails {
    color: white;
    font-size: 18px;
    margin: 15px 0;
}

</style>

</head>


<body>

<a class="back-link" href="members.html">&larr; Back</a>

<h1>Members Gallery</h1>

<div id="message">
    Loading paintings...
</div>

<div id="gallery"></div>


<!-- FULL SIZE VIEW -->

<div id="viewer">

    <div id="closeViewer">&times;</div>

    <div id="viewer-content">

        <img
            id="fullImage"
            src=""
            alt=""
        >

        <div id="fullDetails"></div>

    </div>

</div>


<script>

/* GOOGLE APPS SCRIPT */

const API_URL =
"https://script.google.com/macros/s/AKfycbwn9Uv8UsXz92v8O5Atj6PlJLD4tKXddPNSHzdmCobmJ3BqbQP2UqlUWylRrQP61u3F/exec";


let paintings = [];


fetch(API_URL)

    .then(response => response.json())

    .then(data => {

        paintings = data;

        const gallery =
            document.getElementById("gallery");

        const message =
            document.getElementById("message");


        message.style.display = "none";


        if (!paintings.length) {

            message.style.display = "block";

            message.textContent =
                "No paintings found.";

            return;

        }


        paintings.forEach((painting, index) => {

            const card =
                document.createElement("div");


            card.className =
                "painting";


            card.innerHTML = `

                <img
                    src="${painting.image}"
                    alt="${escapeHtml(painting.artist)}"
                >

                <div class="painting-artist">
                    ${escapeHtml(painting.artist)}
                </div>

            `;


            card.addEventListener(
                "click",
                () => openViewer(index)
            );


            gallery.appendChild(card);

        });

    })

    .catch(error => {

        console.error(error);

        document.getElementById("message").textContent =
            "Sorry — the gallery could not be loaded.";

    });



/* OPEN PAINTING */

function openViewer(index) {

    const painting =
        paintings[index];


    document.getElementById("fullImage").src =
        painting.image;


    document.getElementById("fullImage").alt =
        painting.artist;


    document.getElementById("fullDetails").textContent =
        painting.artist + " · " + painting.date;


    document.getElementById("viewer").style.display =
        "block";

}



/* CLOSE VIEWER */

document
    .getElementById("closeViewer")
    .addEventListener(
        "click",
        closeViewer
    );


document
    .getElementById("viewer")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeViewer();

            }

        }
    );


function closeViewer() {

    document.getElementById("viewer").style.display =
        "none";

}



function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}

</script>
</body>
</html>
