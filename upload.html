<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload pictures</title>
<style>
body{font-family:sans-serif;background:#e8e0f5;margin:0;padding:20px;text-align:center}
a{color:#1a4fa0}
h1{font-size:22px}
.btn{display:block;width:100%;max-width:320px;margin:12px auto;padding:16px;font-size:18px;border:0;border-radius:14px;background:#1a4fa0;color:#fff}
select{font-size:18px;padding:12px;width:100%;max-width:320px;border-radius:10px}
#msg{margin-top:20px;font-size:18px;min-height:60px}
</style>
</head>
<body>
<p style="text-align:left"><a href="admin.html">&larr; Back</a></p>
<h1>Upload pictures</h1>
<p>Where should they go?</p>
<select id="type">
<option value="paintings">Paintings</option>
<option value="templates">Templates</option>
</select>
<input type="file" id="files" accept="image/*" multiple style="display:none">
<button class="btn" onclick="document.getElementById('files').click()">Choose pictures</button>
<div id="msg"></div>
<script>
var URL_="https://script.google.com/macros/s/AKfycbymBxku5hfTBu-QRcv2nnpKOcfqUOHpVdGkTfKvbNIikrJg8U36TMm-Cu5ouGwnWCi4/exec";
function shrink(file){
  return new Promise(function(res,rej){
    var img=new Image();
    var u=URL.createObjectURL(file);
    img.onload=function(){
      var m=1400,w=img.width,h=img.height;
      if(w>m||h>m){var r=Math.min(m/w,m/h);w=Math.round(w*r);h=Math.round(h*r);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',0.8).split(',')[1]);
      URL.revokeObjectURL(u);
    };
    img.onerror=function(){rej(new Error('Could not read picture'));};
    img.src=u;
  });
}
document.getElementById('files').addEventListener('change',async function(e){
  var list=Array.from(e.target.files),msg=document.getElementById('msg'),type=document.getElementById('type').value;
  var done=0,bad=0,next=0;
  async function worker(){
    while(next<list.length){
      var i=next++;
      try{
        var data=await shrink(list[i]);
        await fetch(URL_,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({type:type,name:'upload-'+Date.now()+'-'+i+'.jpg',mime:'image/jpeg',data:data})});
        done++;
      }catch(err){bad++;}
      msg.textContent='Uploaded '+done+' of '+list.length+'...';
    }
  }
  msg.textContent='Uploading '+list.length+'...';
  await Promise.all([worker(),worker(),worker()]);
  msg.textContent='Done: '+done+' sent'+(bad?', '+bad+' failed':'')+'. Now number them in "Number the pictures".';
  e.target.value='';
});
</script>
</body>
</html>
