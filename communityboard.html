<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Board</title>
<style>
  /* ---------- COLOURS (change these to restyle the whole page) ---------- */
  :root {
    --page:   #ece6f7;   /* pale violet background */
    --blue:   #2f6db5;   /* BCAG blue */
    --blue-dark: #1f4f8c;
    --ink:    #2b2540;   /* main text */
    --soft:   #6d6688;   /* small grey-purple text */
    --card:   #ffffff;
    --event:  #2f6db5;   /* Event label colour */
    --shout:  #d9931f;   /* Shout-out label colour */
    --chat:   #7a5bb5;   /* Chat label colour */
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.4;
    padding-bottom: 120px; /* room for the blue bar at the bottom */
  }

  /* extra space at the top keeps the Back link clear of the clock and battery strip */
  .top { padding: calc(env(safe-area-inset-top, 0px) + 40px) 18px 4px; }
  .back {
    display: inline-block;
    color: var(--blue-dark);
    font-weight: 700;
    text-decoration: none;
    padding: 12px 24px 12px 0;
    touch-action: manipulation;
  }
  h1 { margin: 2px 0 2px; font-size: 28px; }
  .intro { margin: 0 0 8px; color: var(--soft); font-size: 15px; }

  .note {
    max-width: 640px;
    margin: 0 auto 8px;
    padding: 0 18px;
    text-align: center;
    color: var(--soft);
    font-size: 14px;
  }
  .note:empty { display: none; }
  .note button {
    background: var(--blue);
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 14px;
    margin-left: 6px;
  }
  .note .detail { font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; }

  .list { padding: 0 14px; max-width: 640px; margin: 0 auto; }

  /* ---------- POST CARDS ---------- */
  .post {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px 14px 18px;
    margin-bottom: 12px;
    border-left: 8px solid var(--chat);
    box-shadow: 0 1px 4px rgba(43, 37, 64, 0.12);
  }
  .post.event   { border-left-color: var(--event); }
  .post.shoutout { border-left-color: var(--shout); }
  .post.chat    { border-left-color: var(--chat); }
  .post.sending { opacity: 0.65; }

  .tag { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .event .tag    { color: var(--event); }
  .shoutout .tag { color: var(--shout); }
  .chat .tag     { color: var(--chat); }

  .headline { font-size: 19px; font-weight: 700; margin: 0 0 4px; }
  .message  { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta     { font-size: 14px; color: var(--soft); }

  .when {
    display: inline-block;
    background: #e3edf9;
    color: var(--blue-dark);
    font-weight: 700;
    border-radius: 10px;
    padding: 3px 10px;
    margin-bottom: 6px;
  }

  .delete {
    float: right;
    background: none;
    border: 1px solid #c9c2dc;
    color: var(--soft);
    border-radius: 8px;
    padding: 3px 10px;
    font-size: 13px;
  }

  .status { text-align: center; color: var(--soft); padding: 30px 20px; }

  /* ---------- BLUE BAR AT THE BOTTOM ---------- */
  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--blue);
    border-radius: 26px 26px 0 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .bar button, .bar .home {
    font-weight: 700;
    font-size: 17px;
    border-radius: 999px;
    padding: 12px 24px;
    touch-action: manipulation;
  }
  .bar button {
    background: #fff;
    color: var(--blue-dark);
    border: 2px solid #fff;
  }
  .bar .home {
    color: #fff;
    text-decoration: none;
    border: 2px solid rgba(255, 255, 255, 0.75);
  }

  /* ---------- POST FORM (slides up over the page) ---------- */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43, 37, 64, 0.55);
    z-index: 10;
  }
  .overlay.open { display: block; }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-height: 92%;
    overflow-y: auto;
    background: #fff;
    border-radius: 26px 26px 0 0;
    padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 22px; }

  .types { display: flex; gap: 8px; margin-bottom: 14px; }
  .types button {
    flex: 1;
    padding: 10px 4px;
    border-radius: 12px;
    border: 2px solid #d5cee6;
    background: #fff;
    color: var(--ink);
    font-size: 16px;
    font-weight: 600;
  }
  .types button.on { color: #fff; border-color: transparent; }
  .types button[data-type="event"].on    { background: var(--event); }
  .types button[data-type="shoutout"].on { background: var(--shout); }
  .types button[data-type="chat"].on     { background: var(--chat); }

  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .hint { font-weight: 400; color: var(--soft); font-size: 14px; }
  input, textarea {
    width: 100%;
    font: inherit;
    padding: 10px 12px;
    border: 2px solid #d5cee6;
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible {
    outline: 3px solid #9bbbe6;
    outline-offset: 1px;
  }

  .error { color: #b3261e; font-weight: 600; margin-top: 12px; min-height: 1.2em; }
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .actions button {
    flex: 1;
    padding: 13px;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 700;
    border: 0;
  }
  .actions .cancel { background: #ece6f7; color: var(--ink); }
  .actions .send   { background: var(--blue); color: #fff; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="top">
  <a class="back" href="members.html">&larr; Back</a>
  <h1>Community Board</h1>
  <p class="intro">Events, shout-outs and chat from the group.</p>
</div>

<div class="note" id="note"></div>

<div class="list" id="list"></div>

<div class="bar">
  <a class="home" href="members.html">&larr; Home</a>
  <button type="button" id="openForm">+ Post something</button>
</div>

<!-- The form -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>New post</h2>

    <div class="types" id="types">
      <button type="button" data-type="event">Event</button>
      <button type="button" data-type="shoutout">Shout-out</button>
      <button type="button" data-type="chat">Chat</button>
    </div>

    <label for="fName">Your name</label>
    <input id="fName" maxlength="60" autocomplete="given-name">

    <div id="titleWrap">
      <label for="fTitle" id="titleLabel">Title</label>
      <input id="fTitle" maxlength="80">
    </div>

    <div id="dateWrap">
      <label for="fDate">Date of the event <span class="hint">(the day it will happen)</span></label>
      <input id="fDate" type="date">
    </div>

    <div id="msgWrap">
      <label for="fMsg" id="msgLabel">Message</label>
      <textarea id="fMsg" maxlength="200"></textarea>
    </div>

    <div class="error" id="formError"></div>

    <div class="actions">
      <button type="button" class="cancel" id="cancelBtn">Cancel</button>
      <button type="button" class="send" id="sendBtn">Post</button>
    </div>
  </div>
</div>

<script>
  /* =====================================================
     SETTINGS - the only thing you might ever need to edit
     ===================================================== */
  // The web address of the "BCAG Community" Apps Script
  var COMMUNITY_URL = "https://script.google.com/macros/s/AKfycbz-LcTRsfi-ER4H8m2TaWthTuWUtSiLzlUBfWWwvdAOKi6yeBE3axGa9uri-xIWbGiE/exec";
  var DAYS_TO_KEEP = 7;   // should match the script

  /* ---------- Make sure the person is logged in ---------- */
  if (!localStorage.getItem("bcagLoggedIn")) {
    window.location.replace("index.html");
  }
  var isAdmin = localStorage.getItem("bcagRole") === "admin";

  var listEl = document.getElementById("list");
  var noteEl = document.getElementById("note");
  var overlay = document.getElementById("overlay");
  var CACHE_KEY = "bcagCommunityCache";

  var currentType = "event";
  var posts = [];            // what is on the screen right now
  var mine = [];             // posts this phone has just sent
  var loadState = "loading"; // "loading", "ready" or "failed"
  var refreshing = false;
  var needAnother = false;

  /* ---------- Small helpers ---------- */
  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text) e.textContent = text;
    return e;
  }

  function niceDate(text) {           // "2026-10-14" -> "Wed 14 Oct"
    var p = String(text).split("-");
    if (p.length !== 3) return text;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  }

  function timeAgo(ms) {
    var mins = Math.floor((Date.now() - ms) / 60000);
    if (mins < 2) return "just now";
    if (mins < 60) return mins + " minutes ago";
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
    var days = Math.floor(hrs / 24);
    return days + (days === 1 ? " day ago" : " days ago");
  }

  function todayText() {              // today as yyyy-mm-dd, local time
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function isSame(a, b) {
    return a.type === b.type && a.name === b.name && a.title === b.title && a.message === b.message;
  }

  /* ---------- Saved copy of the board (so it opens instantly) ---------- */
  function stillCurrent(p) {
    if (p.type === "event") return String(p.eventDate) >= todayText();
    return p.posted > Date.now() - DAYS_TO_KEEP * 24 * 60 * 60 * 1000;
  }

  function loadCache() {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (c && Array.isArray(c.posts)) return c.posts.filter(stillCurrent);
    } catch (e) {}
    return null;
  }

  function saveCache() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ posts: posts })); } catch (e) {}
  }

  /* ---------- The little message line above the posts ---------- */
  function setNote(text, btnLabel, btnFn, detail) {
    noteEl.innerHTML = "";
    if (!text) return;
    noteEl.appendChild(document.createTextNode(text + " "));
    if (btnLabel) {
      var b = el("button", "", btnLabel);
      b.type = "button";
      b.onclick = btnFn;
      noteEl.appendChild(b);
    }
    if (detail) noteEl.appendChild(el("div", "detail", detail));
  }

  /* ---------- Draw the posts ---------- */
  function drawPost(p) {
    var type = ["event", "shoutout", "chat"].indexOf(p.type) === -1 ? "chat" : p.type;
    var card = el("div", "post " + type + (p.sending ? " sending" : ""));
    var isLocal = String(p.id).indexOf("tmp") === 0;
    var when = p.sending ? "Sending\u2026" : timeAgo(p.posted);

    if (isAdmin && !isLocal) {
      var del = el("button", "delete", "Delete");
      del.type = "button";
      del.onclick = function () { deletePost(p); };
      card.appendChild(del);
    }

    if (type === "event") {
      card.appendChild(el("div", "tag", "Event"));
      card.appendChild(el("div", "when", niceDate(p.eventDate)));
      card.appendChild(el("p", "headline", p.title));
      if (p.message) card.appendChild(el("p", "message", p.message));
      card.appendChild(el("div", "meta", "Posted by " + p.name + " \u2022 " + when));
    } else if (type === "shoutout") {
      card.appendChild(el("div", "tag", "Shout-out"));
      card.appendChild(el("p", "headline", "For " + p.title));
      card.appendChild(el("p", "message", p.message));
      card.appendChild(el("div", "meta", "From " + p.name + " \u2022 " + when));
    } else {
      card.appendChild(el("div", "tag", "Chat"));
      card.appendChild(el("p", "message", p.message));
      card.appendChild(el("div", "meta", p.name + " \u2022 " + when));
    }
    return card;
  }

  function render() {
    listEl.innerHTML = "";
    if (posts.length === 0) {
      if (loadState === "ready") {
        listEl.appendChild(el("div", "status", "Nothing here yet. Tap \u201c+ Post something\u201d to be the first."));
      } else if (loadState === "loading") {
        listEl.appendChild(el("div", "status", "Loading\u2026 the first time can take a few seconds."));
      }
      return;
    }
    posts.forEach(function (p) { listEl.appendChild(drawPost(p)); });
  }

  /* ---------- Get the latest posts (quietly, in the background) ---------- */
  function getJson(url, ms) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, ms);
    return fetch(url, { signal: controller.signal, credentials: "omit", cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        clearTimeout(timer);
        try { return JSON.parse(t); }
        catch (e) { throw new Error("The reply was not readable: " + t.slice(0, 60)); }
      })
      .catch(function (err) {
        clearTimeout(timer);
        if (err && err.name === "AbortError") throw new Error("Took too long (over " + (ms / 1000) + " seconds)");
        throw err;
      });
  }

  function mergeMine(list) {
    // keep posts this phone just sent until the board shows them
    mine = mine.filter(function (m) { return !m.doneAt || Date.now() - m.doneAt < 60000; });
    var extra = mine.filter(function (m) {
      return !list.some(function (p) { return isSame(p, m); });
    });
    return extra.concat(list);
  }

  function finishRefresh() {
    refreshing = false;
    if (needAnother) { needAnother = false; refresh(1); }
  }

  function refresh(attempt) {
    attempt = attempt || 1;
    if (attempt === 1) {
      if (refreshing) { needAnother = true; return; }
      refreshing = true;
    }
    if (posts.length > 0) setNote("Updating\u2026");

    getJson(COMMUNITY_URL + "?t=" + Date.now(), 25000)
      .then(function (list) {
        if (!Array.isArray(list)) {
          throw new Error("The board sent back: " + JSON.stringify(list).slice(0, 80));
        }
        posts = mergeMine(list);
        loadState = "ready";
        saveCache();
        render();
        setNote("");
        finishRefresh();
      })
      .catch(function (err) {
        if (attempt < 2) { refresh(2); return; }
        if (posts.length === 0) loadState = "failed";
        render();
        setNote(
          posts.length ? "Couldn\u2019t update. Showing the last posts we have." : "Couldn\u2019t load the board.",
          "Try again",
          function () { refresh(1); },
          String((err && err.message) || err)
        );
        finishRefresh();
      });
  }

  /* ---------- Send a post or delete (in the background) ---------- */
  function send(data) {
    // "text/plain" lets the browser send this to Google without any fuss.
    // "keepalive" lets it finish even if you press Back straight away.
    return fetch(COMMUNITY_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data),
      keepalive: true
    }).then(function (r) { return r.json(); });
  }

  function deletePost(p) {
    if (!confirm("Delete this post?")) return;
    posts = posts.filter(function (x) { return x !== p; });
    mine = mine.filter(function (m) { return !isSame(m, p); });
    saveCache();
    render();
    send({ action: "delete", id: p.id })
      .then(function (res) {
        if (!res.ok) { setNote(res.error || "That post could not be deleted."); refresh(1); }
      })
      .catch(function () {
        setNote("Delete did not go through.", "Try again", function () { refresh(1); });
      });
  }

  /* ---------- The form ---------- */
  function setType(type) {
    currentType = type;
    var buttons = document.querySelectorAll("#types button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("on", buttons[i].getAttribute("data-type") === type);
    }

    document.getElementById("titleWrap").classList.toggle("hidden", type === "chat");
    document.getElementById("dateWrap").classList.toggle("hidden", type !== "event");

    var msgLabel = document.getElementById("msgLabel");
    var titleLabel = document.getElementById("titleLabel");
    if (type === "event") {
      titleLabel.textContent = "What is happening?";
      msgLabel.innerHTML = 'More details <span class="hint">(optional)</span>';
    } else if (type === "shoutout") {
      titleLabel.textContent = "Who is it for?";
      msgLabel.textContent = "Your shout-out";
    } else {
      msgLabel.textContent = "Your message";
    }
    document.getElementById("formError").textContent = "";
  }

  function openForm(prefill) {
    prefill = prefill || {};
    document.getElementById("fName").value = prefill.name || localStorage.getItem("bcagName") || "";
    document.getElementById("fTitle").value = prefill.title || "";
    document.getElementById("fMsg").value = prefill.message || "";
    var dateBox = document.getElementById("fDate");
    dateBox.min = todayText();      // stops past dates being picked
    dateBox.value = prefill.eventDate || "";
    setType(prefill.type || "event");
    overlay.classList.add("open");
  }

  function closeForm() { overlay.classList.remove("open"); }

  function submitForm() {
    var errorBox = document.getElementById("formError");
    var name = document.getElementById("fName").value.trim();

    var data = {
      type: currentType,
      name: name,
      title: currentType === "chat" ? "" : document.getElementById("fTitle").value.trim(),
      message: document.getElementById("fMsg").value.trim(),
      eventDate: currentType === "event" ? document.getElementById("fDate").value : ""
    };

    // Quick checks so people get a clear message straight away
    if (!name) { errorBox.textContent = "Please add your name."; return; }
    if (currentType === "event") {
      if (!data.title) { errorBox.textContent = "Please say what is happening."; return; }
      if (!data.eventDate) { errorBox.textContent = "Please pick the date of the event."; return; }
    } else {
      if (currentType === "shoutout" && !data.title) { errorBox.textContent = "Please say who the shout-out is for."; return; }
      if (!data.message) { errorBox.textContent = "Please type a message."; return; }
    }

    localStorage.setItem("bcagName", name);   // remember their name for next time

    // Show the post straight away and close the form. Sending carries on in the background.
    var tmp = {
      id: "tmp" + Date.now(),
      type: data.type, name: data.name, title: data.title,
      message: data.message, eventDate: data.eventDate,
      posted: Date.now(), sending: true
    };
    mine.unshift(tmp);
    posts.unshift(tmp);
    if (loadState !== "ready") loadState = "ready";
    saveCache();
    render();
    closeForm();

    send(data)
      .then(function (res) {
        if (res && res.ok) {
          tmp.sending = false;
          tmp.doneAt = Date.now();
          render();
          refresh(1);
        } else {
          failed(tmp, data, (res && res.error) || "The post could not be saved.");
        }
      })
      .catch(function () {
        failed(tmp, data, "Check your signal.");
      });
  }

  function failed(tmp, data, reason) {
    posts = posts.filter(function (p) { return p !== tmp; });
    mine = mine.filter(function (m) { return m !== tmp; });
    saveCache();
    render();
    setNote("Your post didn\u2019t send. " + reason, "Edit and try again", function () {
      setNote("");
      openForm(data);
    });
  }

  /* ---------- Wire up the buttons ---------- */
  document.getElementById("openForm").onclick = function () { openForm(); };
  document.getElementById("cancelBtn").onclick = closeForm;
  document.getElementById("sendBtn").onclick = submitForm;
  document.querySelectorAll("#types button").forEach(function (b) {
    b.onclick = function () { setType(b.getAttribute("data-type")); };
  });

  // Update the board whenever the app is opened again
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) refresh(1);
  });

  /* ---------- Start: show the saved copy at once, then update it ---------- */
  var cached = loadCache();
  if (cached) { posts = cached; loadState = "ready"; }
  render();
  refresh(1);
</script>
</body>
</html>
